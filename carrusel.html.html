<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imágenes de nuestro proyecto</title>
    <!-- Font Awesome para el ícono de la casita -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        /* Tres renglones vacíos solicitados */
        .info-lines {
            margin-bottom: 30px;
        }

        .info-lines p {
            margin: 5px 0;
            font-size: 1.1rem;
            color: #555;
        }

        /* Matriz de 2 filas x 3 columnas */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto 40px auto;
            padding: 10px;
        }

        .grid-item {
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }

        .grid-item img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        /* Efecto zoom al pasar el mouse */
        .grid-item img:hover {
            transform: scale(1.1);
        }

        /* Botón verde de inicio */
        .btn-inicio {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #28a745;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-inicio:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <h1>Imágenes de nuestro proyecto</h1>

    <!-- 3 renglones solicitados -->
    <div class="info-lines">
        <p>   </p>
        <p>   </p>
        <p>   </p>
    </div>

    <!-- Matriz 2x3 con imágenes de contaminación -->
    <div class="grid-container">
        <div class="grid-item">
            <a href="https://picsum.photos/id/1015/800/600" target="_blank">
                <img src="https://picsum.photos/id/1015/400/300" alt="Contaminación 1">
            </a>
        </div>
        <div class="grid-item">
            <a href="https://picsum.photos/id/1028/800/600" target="_blank">
                <img src="https://picsum.photos/id/1028/400/300" alt="Contaminación 2">
            </a>
        </div>
        <div class="grid-item">
            <a href="https://picsum.photos/id/1039/800/600" target="_blank">
                <img src="https://picsum.photos/id/1039/400/300" alt="Contaminación 3">
            </a>
        </div>
        <div class="grid-item">
            <a href="https://picsum.photos/id/1043/800/600" target="_blank">
                <img src="https://picsum.photos/id/1043/400/300" alt="Contaminación 4">
            </a>
        </div>
        <div class="grid-item">
            <a href="https://picsum.photos/id/1056/800/600" target="_blank">
                <img src="https://picsum.photos/id/1056/400/300" alt="Contaminación 5">
            </a>
        </div>
        <div class="grid-item">
            <a href="https://picsum.photos/id/1068/800/600" target="_blank">
                <img src="https://picsum.photos/id/1068/400/300" alt="Contaminación 6">
            </a>
        </div>
    </div>

    <!-- Botón verde redirigiendo a index.html o index.html.html -->
    <a href="index.html.html" class="btn-inicio">
        <i class="fa-solid fa-house"></i> Inicio
    </a>

</body>
</html>
