<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imágenes de nuestro proyecto</title>
    <style>
        body {
            background-color: #fce4ec;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px;
        }

        h1 {
            color: #ad1457;
            font-family: Georgia, serif;
            font-size: 32px;
            margin-bottom: 20px;
        }

        .renglones-info {
            background-color: #ffffff;
            max-width: 800px;
            margin: 0 auto 30px auto;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .renglon {
            font-size: 18px;
            color: #444444;
            margin: 10px 0;
            min-height: 24px;
        }

        /* Matriz de 2 filas x 3 columnas */
        .galeria-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 900px;
            margin: 0 auto 40px auto;
        }

        .tarjeta-imagen {
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background-color: white;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            display: block;
        }

        /* Efecto Zoom al pasar el mouse */
        .tarjeta-imagen img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .tarjeta-imagen:hover img {
            transform: scale(1.15);
        }

        .tarjeta-imagen:hover {
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        /* Estilo para el botón de Inicio en color verde */
        .contenedor-boton {
            margin-top: 30px;
        }

        .boton-inicio {
            background-color: #2e8b57; /* Verde */
            color: #ffffff !important;
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none !important;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.1s ease, background-color 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .boton-inicio:hover {
            background-color: #246b43;
        }

        /* Efecto de hundimiento al dar clic */
        .boton-inicio:active {
            transform: translateY(4px);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <!-- Título principal -->
    <h1>Imagenes de nuestro proyecto</h1>

    <!-- 3 Renglones con información -->
    <div class="renglones-info">
        <p class="renglon">Galería visual sobre el impacto social y condiciones de la pobreza.</p>
        <p class="renglon">Haz clic sobre cualquier imagen para desplegarla en tamaño completo en una nueva pestaña.</p>
        <p class="renglon">Pasa el cursor sobre cada una para apreciar los detalles con el efecto de acercamiento.</p>
    </div>

    <!-- Matriz de 2 por 3 con las 6 imágenes sobre la pobreza -->
    <div class="galeria-grid">
        
        <!-- Imagen 1 -->
        <a href="https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?w=1200" target="_blank" class="tarjeta-imagen">
            <img src="https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?w=600&auto=format&fit=crop" alt="Vivienda y entorno comunitario">
        </a>

        <!-- Imagen 2 -->
        <a href="https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=1200" target="_blank" class="tarjeta-imagen">
            <img src="https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=600&auto=format&fit=crop" alt="Educación y rezago escolar">
        </a>

        <!-- Imagen 3 -->
        <a href="https://images.unsplash.com/photo-1509099836639-18ba1795216d?w=1200" target="_blank" class="tarjeta-imagen">
            <img src="https://images.unsplash.com/photo-1509099836639-18ba1795216d?w=600&auto=format&fit=crop" alt="Trabajo informal y esfuerzo diario">
        </a>

        <!-- Imagen 4 -->
        <a href="https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?w=1200" target="_blank" class="tarjeta-imagen">
            <img src="https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?w=600&auto=format&fit=crop" alt="Alimentación y apoyo comunitario">
        </a>

        <!-- Imagen 5 -->
        <a href="https://images.unsplash.com/photo-1502086223501-7ea6ecd79368?w=1200" target="_blank" class="tarjeta-imagen">
            <img src="https://images.unsplash.com/photo-1502086223501-7ea6ecd79368?w=600&auto=format&fit=crop" alt="Infancia y futuro en la comunidad">
        </a>

        <!-- Imagen 6 -->
        <a href="https://images.unsplash.com/photo-1531206715517-5c0ba140b2b8?w=1200" target="_blank" class="tarjeta-imagen">
            <img src="https://images.unsplash.com/photo-1531206715517-5c0ba140b2b8?w=600&auto=format&fit=crop" alt="Comunidad unida buscando soluciones">
        </a>

    </div>

    <!-- Botón verde con enlace directo que redirige a index.html -->
    <div class="contenedor-boton">
        <a href="index.html" class="boton-inicio">🏠 Inicio</a>
    </div>

</body>
</html>
